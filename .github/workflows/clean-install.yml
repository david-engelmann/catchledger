name: clean-install

on:
  workflow_run:
    workflows:
      - "Release"
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to verify (or latest)"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read

concurrency:
  group: clean-install-${{ inputs.version || github.event.workflow_run.head_branch || 'latest' }}
  cancel-in-progress: false

jobs:
  install:
    name: install (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Resolve target release tag and smoke-check install.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -eu
          TARGET_VER="${REQUESTED_VERSION:-}"
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "${UPSTREAM_RUN_ID:-}" ]; then
            REL_CONCLUSION="$(gh api "repos/$GH_REPO/actions/runs/$UPSTREAM_RUN_ID/jobs" --jq '.jobs[] | select(.name == "github-release") | .conclusion // "none"' | head -n 1)"
            if [ "$REL_CONCLUSION" = "skipped" ]; then
              echo "Upstream Release run skipped github-release, skipping clean-install check"
              exit 0
            fi
            ART_DIR="$(mktemp -d)"
            gh run download "$UPSTREAM_RUN_ID" -n published-release-tag -D "$ART_DIR"
            if [ -s "$ART_DIR/tag.txt" ]; then
              TARGET_VER="$(tr -d '[:space:]' < "$ART_DIR/tag.txt")"
            fi
            rm -rf "$ART_DIR"
            if [ -z "$TARGET_VER" ]; then
              echo "clean-install error, published-release-tag artifact was empty" >&2
              exit 1
            fi
          fi
          TARGET_VER="${TARGET_VER:-latest}"
          TMP_SH="$(mktemp)"
          trap 'rm -f "$TMP_SH"' EXIT INT TERM
          curl -fsSL "https://raw.githubusercontent.com/david-engelmann/catchledger/main/install.sh" -o "$TMP_SH"
          CATCHLEDGER_VERSION="$TARGET_VER" sh "$TMP_SH"
          "$HOME/.local/bin/catchledger" --help >/dev/null
