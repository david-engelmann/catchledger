<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="catchledger social preview card">
  <title>catchledger conservative per-check CI scorecard</title>
  <rect width="1280" height="640" fill="#141413"/>
  <rect x="36" y="36" width="1208" height="568" rx="28" fill="#1b1a17" stroke="#35322d" stroke-width="2"/>
  <rect x="84" y="88" width="176" height="36" rx="18" fill="#152530" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="108" cy="106" r="5" fill="#38bdf8"/>
  <text x="124" y="111" fill="#7dd3fc" font-family="'SFMono-Regular', ui-monospace, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1">GATE TRUTH ARC</text>

  <text x="84" y="210" fill="#f5f2eb" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-1.8">catchledger</text>
  <text x="84" y="274" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="31" font-weight="700">Price every CI check by what happened after it blocked.</text>
  <text x="84" y="334" fill="#d6d3d1" font-family="system-ui, -apple-system, sans-serif" font-size="24">
    <tspan x="84" dy="0">Join local CI workflow history and Git ancestry to separate</tspan>
    <tspan x="84" dy="36">true defect catches from bare-retry flakes, compute exact</tspan>
    <tspan x="84" dy="36">cost per catch, and emit evidence packs for tameshi.</tspan>
  </text>

  <g font-family="'SFMono-Regular', ui-monospace, Menlo, monospace" font-size="16" fill="#a8a29e">
    <rect x="84" y="476" width="260" height="54" rx="12" fill="#24221f" stroke="#3f3c37"/>
    <text x="214" y="509" text-anchor="middle" fill="#f5f2eb">Zero network calls</text>
    <rect x="364" y="476" width="280" height="54" rx="12" fill="#24221f" stroke="#3f3c37"/>
    <text x="504" y="509" text-anchor="middle" fill="#f5f2eb">Fixed-point Decimal USD</text>
    <rect x="664" y="476" width="310" height="54" rx="12" fill="#24221f" stroke="#3f3c37"/>
    <text x="819" y="509" text-anchor="middle" fill="#f5f2eb">Publishes catchledger-pack/1</text>
  </g>
</svg>
