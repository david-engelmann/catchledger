<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-label="Gate Truth verification suite architecture">
  <title>The nine repositories of the Gate Truth arc highlighting catchledger</title>
  <rect width="960" height="390" rx="20" fill="#181715" stroke="#35322d" stroke-width="1.5"/>
  <text x="26" y="36" fill="#38bdf8" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">THE GATE TRUTH SUITE  /  NINE ORTHOGONAL QUESTIONS</text>
  <text x="26" y="62" fill="#f5f2eb" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="750">Every layer between a green merge button and real defect evidence is audited offline.</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="24" y="82" width="294" height="90" rx="11" fill="#211f1c" stroke="#35322d" stroke-width="1.3"/>
    <text x="38" y="106" fill="#f5f2eb" font-family="'SFMono-Regular', ui-monospace, monospace" font-size="13.5" font-weight="750">01  deadgate</text>
    <text x="38" y="128" fill="#cbd5e1" font-size="12.5" font-weight="700">Did the required check run?</text>
    <text x="38" y="148" fill="#a8a29e" font-size="11.5">Protection, workflow YAML, and job history</text>

    <rect x="333" y="82" width="294" height="90" rx="11" fill="#211f1c" stroke="#35322d" stroke-width="1.3"/>
    <text x="347" y="106" fill="#f5f2eb" font-family="'SFMono-Regular', ui-monospace, monospace" font-size="13.5" font-weight="750">02  finaltree</text>
    <text x="347" y="128" fill="#cbd5e1" font-size="12.5" font-weight="700">What tree did it run on?</text>
    <text x="347" y="148" fill="#a8a29e" font-size="11.5">Working-tree fingerprint bound to gate logs</text>

    <rect x="642" y="82" width="294" height="90" rx="11" fill="#211f1c" stroke="#35322d" stroke-width="1.3"/>
    <text x="656" y="106" fill="#f5f2eb" font-family="'SFMono-Regular', ui-monospace, monospace" font-size="13.5" font-weight="750">03  blindgate</text>
    <text x="656" y="128" fill="#cbd5e1" font-size="12.5" font-weight="700">What files did it read?</text>
    <text x="656" y="148" fill="#a8a29e" font-size="11.5">Linux strace descriptor and path reconstruction</text>

    <rect x="24" y="184" width="294" height="90" rx="11" fill="#211f1c" stroke="#35322d" stroke-width="1.3"/>
    <text x="38" y="208" fill="#f5f2eb" font-family="'SFMono-Regular', ui-monospace, monospace" font-size="13.5" font-weight="750">04  hookdoctor</text>
    <text x="38" y="230" fill="#cbd5e1" font-size="12.5" font-weight="700">Do hooks enforce their rules?</text>
    <text x="38" y="250" fill="#a8a29e" font-size="11.5">Hook definitions reconciled against denials</text>

    <rect x="333" y="184" width="294" height="90" rx="11" fill="#211f1c" stroke="#35322d" stroke-width="1.3"/>
    <text x="347" y="208" fill="#f5f2eb" font-family="'SFMono-Regular', ui-monospace, monospace" font-size="13.5" font-weight="750">05  ostensible</text>
    <text x="347" y="230" fill="#cbd5e1" font-size="12.5" font-weight="700">Can the test actually fail?</text>
    <text x="347" y="250" fill="#a8a29e" font-size="11.5">Static tautology scan and pytest mutations</text>

    <rect x="642" y="184" width="294" height="90" rx="11" fill="#211f1c" stroke="#35322d" stroke-width="1.3"/>
    <text x="656" y="208" fill="#f5f2eb" font-family="'SFMono-Regular', ui-monospace, monospace" font-size="13.5" font-weight="750">06  canaryfield</text>
    <text x="656" y="230" fill="#cbd5e1" font-size="12.5" font-weight="700">Does the harness catch defects?</text>
    <text x="656" y="250" fill="#a8a29e" font-size="11.5">Planted defect seeds scored against real gates</text>

    <rect x="24" y="286" width="294" height="90" rx="11" fill="#211f1c" stroke="#35322d" stroke-width="1.3"/>
    <text x="38" y="310" fill="#f5f2eb" font-family="'SFMono-Regular', ui-monospace, monospace" font-size="13.5" font-weight="750">07  greenharvest</text>
    <text x="38" y="332" fill="#cbd5e1" font-size="12.5" font-weight="700">Which tests earn their runtime?</text>
    <text x="38" y="352" fill="#a8a29e" font-size="11.5">Exact rational diet with holdout quarantine</text>

    <rect x="333" y="286" width="294" height="90" rx="11" fill="#152530" stroke="#38bdf8" stroke-width="2.4"/>
    <rect x="537" y="296" width="76" height="20" rx="10" fill="#38bdf8"/>
    <text x="575" y="309.5" text-anchor="middle" fill="#141413" font-family="'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="800">THIS REPO</text>
    <text x="347" y="310" fill="#f5f2eb" font-family="'SFMono-Regular', ui-monospace, monospace" font-size="13.5" font-weight="750">08  catchledger</text>
    <text x="347" y="332" fill="#7dd3fc" font-size="12.5" font-weight="700">What has each check caught?</text>
    <text x="347" y="352" fill="#d6d3d1" font-size="11.5">Conservative CI block attribution and cost</text>

    <rect x="642" y="286" width="294" height="90" rx="11" fill="#211f1c" stroke="#35322d" stroke-width="1.3"/>
    <text x="656" y="310" fill="#f5f2eb" font-family="'SFMono-Regular', ui-monospace, monospace" font-size="13.5" font-weight="750">09  tameshi</text>
    <text x="656" y="332" fill="#cbd5e1" font-size="12.5" font-weight="700">Keep, demote, quarantine, or kill?</text>
    <text x="656" y="352" fill="#a8a29e" font-size="11.5">Floor-gated evidence packs and unsigned PRs</text>
  </g>
</svg>
