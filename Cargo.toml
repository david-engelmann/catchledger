[package]
name = "catchledger"
version = "0.1.0"
edition = "2021"
description = "It records fires, blocks, true catches, false blocks, flake rate, runtime, and cost per catch for each gate, joined from CI logs to what happened next."
license = "MIT"

[lib]
name = "catchledger"
path = "src/lib.rs"

[[bin]]
name = "catchledger"
path = "src/main.rs"
